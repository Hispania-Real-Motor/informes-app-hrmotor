name: Documentation integrity

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose documentation contract is validated
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-integrity:
    name: docs-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validator entry points
        shell: bash
        run: |
          for directory in scripts tests tests/documentation; do
            mode="$(git ls-tree HEAD -- "$directory" | cut -d' ' -f1)"
            if [[ "$mode" != "040000" ]]; then
              echo "Validator directory is not a Git tree: $directory" >&2
              exit 1
            fi
          done
          while IFS= read -r -d '' entry; do
            mode="${entry%% *}"
            if [[ "$mode" != "100644" && "$mode" != "100755" ]]; then
              echo "Validator entry point is not a regular file: ${entry#*$'\t'}" >&2
              exit 1
            fi
          done < <(git ls-files -s -z -- scripts/check_documentation_integrity.py tests/documentation)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test documentation validator
        run: python -m unittest discover -s tests/documentation -p 'test_*.py'

      - name: Validate PR documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/check_documentation_integrity.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --event-json "$GITHUB_EVENT_PATH"
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/${{ inputs.pr_number }}" \
            -o "$RUNNER_TEMP/pr.json"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"
          python scripts/check_documentation_integrity.py \
            --base "$(git rev-parse origin/main)" \
            --head "$GITHUB_SHA" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md"
